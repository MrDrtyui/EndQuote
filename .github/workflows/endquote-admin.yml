name: EndQuote Admin checks
on:
  push:
    branches: [feat/endquote-admin-linear-mfa]
  pull_request:
    paths:
      - 'endquote-furniture/server/**'
      - 'endquote-furniture/src/admin/**'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            endquote-furniture/package-lock.json
            endquote-furniture/server/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: endquote-furniture
      - name: Install backend dependencies
        run: npm ci
        working-directory: endquote-furniture/server
      - name: Generate Prisma client
        run: npm run generate
        working-directory: endquote-furniture/server
      - name: Build backend
        run: npm run build
        working-directory: endquote-furniture/server
      - name: Admin MFA unit tests
        run: node --test tests/admin-security.test.mjs
        working-directory: endquote-furniture/server
      - name: Build frontend
        run: npm run build
        working-directory: endquote-furniture

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: eq_test_012345abcdef
          POSTGRES_PASSWORD: disposable_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eq_test_012345abcdef"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://runtime:disposable_runtime_password@127.0.0.1:5432/eq_test_012345abcdef
      MIGRATION_DATABASE_URL: postgresql://postgres:disposable_ci_password@127.0.0.1:5432/eq_test_012345abcdef
      TEST_DB_NAME: eq_test_012345abcdef
      TEST_DB_ADDR: 127.0.0.1:5432
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: disposable-admin-ci
      S3_ACCESS_KEY: disposable-key
      S3_SECRET_KEY: disposable-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: endquote-furniture/server/package-lock.json
      - name: Install server dependencies
        run: npm ci
        working-directory: endquote-furniture/server
      - name: Create isolated runtime role
        run: |
          PG=$(docker ps -q --filter 'ancestor=postgres:17' | head -1)
          test -n "$PG"
          docker exec "$PG" psql -U postgres -d eq_test_012345abcdef -c "CREATE ROLE runtime LOGIN PASSWORD 'disposable_runtime_password';"
      - name: Generate and migrate disposable PostgreSQL
        working-directory: endquote-furniture/server
        run: |
          npm run generate
          npx prisma migrate deploy
          npm run build
          node dist/src/grants.js
      - name: Verify MFA and two-business admin access
        working-directory: endquote-furniture/server
        run: node --test tests/admin-security.test.mjs tests/admin-access.test.mjs
