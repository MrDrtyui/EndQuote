services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: endquote
      POSTGRES_USER: migrator
      POSTGRES_PASSWORD: ${MIGRATION_PASSWORD:?}
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD:?}
    volumes:
      - database:/var/lib/postgresql/data
      - ./server/init-db.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
    healthcheck:
      test: ["CMD","pg_isready","-U","migrator","-d","endquote"]
      interval: 3s
      retries: 15
      timeout: 3s
  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${STORAGE_ADMIN:?}
      MINIO_ROOT_PASSWORD: ${STORAGE_PASSWORD:?}
    volumes:
      - objects:/data
  migrate:
    build: .
    environment:
      MIGRATION_DATABASE_URL: postgresql://migrator:${MIGRATION_PASSWORD}@postgres/endquote
    depends_on:
      postgres: {condition: service_healthy}
    command: ["sh","-ec","./node_modules/.bin/prisma migrate deploy && node dist/src/grants.js"]
  app:
    build: .
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      DATABASE_URL: postgresql://runtime:${RUNTIME_PASSWORD}@postgres/endquote
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: ${S3_BUCKET:?}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage: {condition: service_started}
volumes:
  database: {}
  objects: {}
