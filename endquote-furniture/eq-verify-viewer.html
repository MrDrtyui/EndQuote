<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121311" />
    <meta name="description" content="EndQuote — интерактивная витрина услуг для мастеров и небольших компаний. Одна ссылка в профиле: каталог, расчёт стоимости и понятная заявка. Попробуйте клиентское демо." />
    <meta property="og:title" content="EndQuote — ваши услуги, ваши цены, одна ссылка" />
    <meta property="og:description" content="Превратите ссылку в профиле в каталог услуг с расчётом стоимости. Посмотрите, как это работает, на настоящем демо химчистки мебели." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EndQuote" />
    <meta property="og:image" content="/marketing/study-sofa-2-seater.webp" />
    <meta property="og:image:alt" content="Предмет из демо-каталога EndQuote — двухместный диван в студийном 3D-превью." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>EndQuote — ваши услуги, ваши цены, одна ссылка</title>
  <script>history.replaceState(null,'','/chistodom');
(async()=>{
  const logs=[];
  const q=s=>document.querySelector(s);
  const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const wait=async fn=>{for(let n=0;n<240;n++){const value=fn();if(value)return value;await sleep(100)}throw Error('Timed out '+fn)};
  const button=async label=>(await wait(()=>[...document.querySelectorAll('dialog button')].find(el=>(el.getAttribute('aria-label')||el.textContent.trim())===label))).click();
  const realFetch=window.fetch.bind(window);
  let interrupt=false;
  window.fetch=async (...args)=>{
    const isModel=String(args[0]).includes('.glb');
    if(isModel && interrupt){interrupt=false;throw new TypeError('QA interrupted download')}
    const r=await realFetch(...args);
    if(isModel)logs.push([String(args[0]),r.status,r.headers.get('Content-Length')]);
    return r;
  };
  const ready=()=>q('[data-viewer-state=ready] canvas');
  try{
    for(const id of ['sofa-l-shaped','sofa-u-shaped','sofa-2-seater']){
      (await wait(()=>q('[data-testid=booking-card-'+id+']'))).click();
      await wait(ready);
      await button('Фото');await (await wait(()=>q('.sf-photo img'))).decode();
      if(id==='sofa-2-seater') interrupt=true;
      await button('3D');
      if(id==='sofa-2-seater'){
        await wait(()=>q('[data-viewer-state=fallback]'));
        logs.push(['fallback caption',q('.sf-gallery-caption span').textContent]);
        await button('Повторить 3D-просмотр');
      }
      await wait(ready);logs.push([id,'ready',q('.sf-gallery-stage').clientHeight]);
      if(id!=='sofa-2-seater'){await button('Закрыть настройку');await wait(()=>!q('dialog'))}
    }
    logs.push(['success',location.href]);
  }catch(e){logs.push(['failed',String(e),q('.viewer-fallback')?.innerText,document.title,q('h1')?.textContent]);}
  await realFetch('http://127.0.0.1:53173/report',{method:'POST',mode:'no-cors',body:JSON.stringify(logs)});
})();
</script></head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
